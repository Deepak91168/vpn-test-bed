# OpenVPN server — TCP transport on port 443. Runs ALONGSIDE the existing UDP
# server (udp/1194) using a DISTINCT subnet + tun so they don't clash.
# Place ca.crt / server.crt / server.key / dh.pem beside this file.
port 443
proto tcp
dev tun

ca ca.crt
cert server.crt
key server.key
dh dh.pem

topology subnet
server 10.9.0.0 255.255.255.0
push "redirect-gateway def1 bypass-dhcp"
keepalive 10 60

data-ciphers AES-256-GCM
auth SHA256
persist-key
persist-tun

status openvpn-status-tcp.log
log openvpn-tcp.log
verb 3
# tls-auth ta.key 0     # uncomment ONLY if you use tls-auth (client must match with 1)
