port 1194
proto udp
dev tun

# Certificates
ca ca.crt
cert server.crt
key server.key
dh dh.pem

# TLS authentication
# tls-auth ta.key 0

# VPN subnet
server 10.8.0.0 255.255.255.0
topology subnet

# Crypto
data-ciphers AES-256-GCM:AES-128-GCM
data-ciphers-fallback AES-256-GCM
auth SHA256

# Keep tunnel alive
keepalive 10 60

# Persist
persist-key
persist-tun

# Logging
verb 6
status openvpn-status.log
# log openvpn.log